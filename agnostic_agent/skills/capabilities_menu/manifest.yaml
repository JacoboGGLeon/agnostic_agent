api_version: skill/v1
kind: skill
name: capabilities_menu
version: 1.0.0
description: Menu de capacidades y exploracion de skills/tools/knowledge.
entrypoint: skill:build
instructions: instructions.md
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
tools:
  declared:
  - list_skills
  - read_skill
  - list_tools
  - read_tool
  - hkb_status
  - list_hkb_documents
  - list_knowledge
  - read_knowledge
knowledge:
  bindings:
  - knowledge/README.md
composition:
  callable_as_skill: true
  can_call_skills: false
testing:
  mode: explicit_or_auto
execution:
  backend: native_python
metadata:
  portability: self_contained_skill_bundle
  language: es
