api_version: skill/v1
kind: skill
name: chat_db
version: 1.0.0
world: chat_db
description: Mundo especializado para explorar, consultar y explicar bases SQLite mediante NL2SQL y ejecucion read-only.
intents:
  - query_data
  - aggregate_data
  - compare_entities
  - explain_schema
  - batch_query
entities:
  - db_path
  - entity_id
  - table
  - column
entrypoint: skill:build
instructions: instructions.md
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
tools:
  declared:
    - nl2sql
    - inspect_sqlite_schema
    - execute_sql_readonly
knowledge:
  bindings:
    - ../nl2sql_sqlite/knowledge/contabilidad.db
    - ../nl2sql_sqlite/knowledge/transacciones.db
    - knowledge/catalog_contabilidad.json
    - knowledge/catalog_transacciones.json
composition:
  callable_as_skill: true
  can_call_skills: false
testing:
  mode: explicit_or_auto
execution:
  backend: native_python
planner:
  allowed_dag_patterns:
    - chat_db_query
  intent_to_tools:
    query_data:
      - nl2sql
    aggregate_data:
      - nl2sql
    compare_entities:
      - nl2sql
    explain_schema:
      - inspect_sqlite_schema
    batch_query:
      - nl2sql
  intent_to_knowledge:
    query_data:
      - ../nl2sql_sqlite/knowledge/contabilidad.db
      - ../nl2sql_sqlite/knowledge/transacciones.db
      - knowledge/catalog_contabilidad.json
      - knowledge/catalog_transacciones.json
    aggregate_data:
      - ../nl2sql_sqlite/knowledge/contabilidad.db
      - ../nl2sql_sqlite/knowledge/transacciones.db
      - knowledge/catalog_contabilidad.json
      - knowledge/catalog_transacciones.json
    compare_entities:
      - ../nl2sql_sqlite/knowledge/contabilidad.db
      - ../nl2sql_sqlite/knowledge/transacciones.db
      - knowledge/catalog_contabilidad.json
      - knowledge/catalog_transacciones.json
    explain_schema:
      - ../nl2sql_sqlite/knowledge/contabilidad.db
      - ../nl2sql_sqlite/knowledge/transacciones.db
      - knowledge/catalog_contabilidad.json
      - knowledge/catalog_transacciones.json
    batch_query:
      - ../nl2sql_sqlite/knowledge/contabilidad.db
      - ../nl2sql_sqlite/knowledge/transacciones.db
      - knowledge/catalog_contabilidad.json
      - knowledge/catalog_transacciones.json
  intent_to_workflows: {}
  tool_priority:
    - nl2sql
    - inspect_sqlite_schema
    - execute_sql_readonly
  default_row_limits:
    query_data: 50
    aggregate_data: 50
summarizer:
  response_modes:
    - user
    - technical
    - batch_summary
  output_style: db_analyst
  required_sections:
    - resumen
validator:
  coverage_rules:
    - every_subquery_requires_artifact
  required_artifacts:
    - sql_result
ui:
  world_label: Chat DB
  world_description: Mundo especializado en chat con bases SQLite.
metadata:
  domain: generic_sqlite
