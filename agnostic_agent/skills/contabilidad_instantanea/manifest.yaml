api_version: skill/v1
kind: skill
name: contabilidad_instantanea
version: 1.2.0
world: contabilidad_automatica
description: Conciliacion contable 1-a-1 por credito alineada al caso de uso financiero
  del notebook de AIS.
intents:
- reconcile_credit
- query_financial_data
- explain_rule
entities:
- credito_id
- saldo_total
- estatus
entrypoint: skill:build
instructions: instructions.md
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
tools:
  declared:
  - reconcile_credit_accounting
  - query_transactions_db
  - query_accounting_db
  - get_saneamiento_rate
  - finance_sources_status
  - nl2sql
knowledge:
  bindings:
  - FinanceRulesKB
  - knowledge/contabilidad.db
  - knowledge/transacciones.db
  - knowledge/rules.md
  - knowledge/dictionary.md
composition:
  callable_as_skill: true
  can_call_skills: false
testing:
  mode: explicit_or_auto
execution:
  backend: native_python
planner:
  allowed_dag_patterns:
  - deterministic_reconcile
  - financial_query
  intent_to_tools:
    reconcile_credit:
    - reconcile_credit_accounting
    query_financial_data:
    - nl2sql
    explain_rule:
    - get_saneamiento_rate
  intent_to_knowledge:
    reconcile_credit:
    - knowledge/contabilidad.db
    - knowledge/transacciones.db
    - knowledge/rules.md
    - knowledge/dictionary.md
    query_financial_data:
    - knowledge/contabilidad.db
    - knowledge/transacciones.db
    explain_rule:
    - knowledge/rules.md
    - knowledge/dictionary.md
  intent_to_workflows: {}
  tool_priority:
  - reconcile_credit_accounting
  - nl2sql
  - get_saneamiento_rate
  default_row_limits:
    query_financial_data: 50
summarizer:
  response_modes:
  - user
  - audit
  - batch_summary
  output_style: finance_audit
  required_sections:
  - estado_final
  - hallazgos
validator:
  coverage_rules:
  - every_subquery_requires_artifact
  required_artifacts:
  - query_result
ui:
  world_label: Contabilidad Automatica
  world_description: Mundo financiero para conciliacion, auditoria y exploracion contable.
  hidden: true
metadata:
  parity_target: notebook_finance_es.ipynb
  canonical_skill_in_notebook: reconcile_accounts
  persona: Contador IA
  language: es
  deprecated: true
